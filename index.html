<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siña Papiamentu</title>
</head>
<body>
<style>
:root{
  --bg:#F4E7CF; --panel:#FBF2DE; --panel2:#EBDBBB; --ink:#3B2A1D; --muted:#8A7156;
  --line:#D8C098; --sea:#D95436; --sea-deep:#A23A21; --sea-soft:#F6DDC8;
  --sun:#E8940A; --sun-soft:#F7E3B4; --sun-ink:#8F5B06;
  --coral:#C2452C; --good:#2F7D46; --good-soft:#E2EBCF; --bad:#C23B2E; --bad-soft:#F3D6CB;
  --pap:#155E52; --shadow:3px 3px 0 rgba(59,42,29,.16);
  --sky1:#FBC968; --sky2:#F1913C; --sky3:#D95436; --sky4:#7E3355; --heroink:#FFF3DC;
  --sil:#38203A; --wave:#155E52;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1B2130; --panel:#252C40; --panel2:#161C2B; --ink:#F0E3C6; --muted:#AC9C7F;
    --line:#3A4158; --sea:#E7714F; --sea-deep:#F0906C; --sea-soft:#41302F;
    --sun:#F0A83B; --sun-soft:#3C3220; --sun-ink:#F5C87A;
    --coral:#E0604A; --good:#5CAD74; --good-soft:#22301F; --bad:#DF6B57; --bad-soft:#3A211C;
    --pap:#6BC7B2; --shadow:3px 3px 0 rgba(0,0,0,.4);
    --sky1:#584070; --sky2:#8E4260; --sky3:#C25543; --sky4:#1E2436; --heroink:#F7E9CD;
    --sil:#12141F; --wave:#2E6B5E;
  }
}
:root[data-theme="light"]{
  --bg:#F4E7CF; --panel:#FBF2DE; --panel2:#EBDBBB; --ink:#3B2A1D; --muted:#8A7156;
  --line:#D8C098; --sea:#D95436; --sea-deep:#A23A21; --sea-soft:#F6DDC8;
  --sun:#E8940A; --sun-soft:#F7E3B4; --sun-ink:#8F5B06;
  --coral:#C2452C; --good:#2F7D46; --good-soft:#E2EBCF; --bad:#C23B2E; --bad-soft:#F3D6CB;
  --pap:#155E52; --shadow:3px 3px 0 rgba(59,42,29,.16);
  --sky1:#FBC968; --sky2:#F1913C; --sky3:#D95436; --sky4:#7E3355; --heroink:#FFF3DC;
  --sil:#38203A; --wave:#155E52;
}
:root[data-theme="dark"]{
  --bg:#1B2130; --panel:#252C40; --panel2:#161C2B; --ink:#F0E3C6; --muted:#AC9C7F;
  --line:#3A4158; --sea:#E7714F; --sea-deep:#F0906C; --sea-soft:#41302F;
  --sun:#F0A83B; --sun-soft:#3C3220; --sun-ink:#F5C87A;
  --coral:#E0604A; --good:#5CAD74; --good-soft:#22301F; --bad:#DF6B57; --bad-soft:#3A211C;
  --pap:#6BC7B2; --shadow:3px 3px 0 rgba(0,0,0,.4);
  --sky1:#584070; --sky2:#8E4260; --sky3:#C25543; --sky4:#1E2436; --heroink:#F7E9CD;
  --sil:#12141F; --wave:#2E6B5E;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",Seravek,system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.pap{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; color:var(--pap)}
#shell{max-width:720px;margin:0 auto;padding:0 16px 96px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
input{font:inherit;color:var(--ink)}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 6px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:20px;font-weight:700}
.brand h1 .pap{font-weight:400;font-style:italic}
.facades{display:flex;align-items:flex-end;gap:2px;height:26px}
.facades span{width:9px;border-radius:1px 1px 0 0;display:block}
.facades span::before{content:""}
.hbtns{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);font-size:16px}
.iconbtn[aria-pressed="false"]{opacity:.45}

/* hero — zonsondergang-poster */
.hero{position:relative;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 38%,var(--sky3) 72%,var(--sky4) 100%);
  border:2px solid var(--ink);border-radius:10px;padding:22px 18px 0;color:var(--heroink);
  box-shadow:var(--shadow);overflow:hidden;margin-top:6px}
.hero::after{content:"";position:absolute;inset:7px;border:1.5px solid rgba(255,246,227,.4);border-radius:5px;pointer-events:none}
.postersun{position:absolute;top:20px;right:26px;width:70px;height:70px;pointer-events:none}
.postersun::before{content:"";position:absolute;inset:-24px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,242,200,.32) 0 7deg,transparent 7deg 20deg)}
.postersun::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFF0BC,#F7C548)}
.hero .pap{color:var(--heroink)}
.hgreet{position:relative;z-index:1}
.hgreet .g{font-size:36px;font-style:italic;font-weight:700}
.hsub{font-size:13.5px;opacity:.9;display:block;margin-top:2px;max-width:70%}
.wod{position:relative;z-index:1;margin:14px 0 2px;padding-top:12px;border-top:1.5px solid rgba(255,246,227,.35)}
.wod .eyebrow{color:var(--heroink);opacity:.7}
.wod button{text-align:left;font-size:15.5px;color:var(--heroink);display:block;margin-top:3px}
.wod .pap{font-size:19px}
.skyline{display:flex;align-items:flex-end;gap:3px;height:30px;margin-top:12px}
.skyline i{display:block;flex:1;border-radius:2px 2px 0 0;background:var(--sil) !important;opacity:.9}
.waves{display:block;width:calc(100% + 36px);margin:-6px -18px 0;height:16px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat.sun b{color:var(--sun-ink)}
.stat.due b{color:var(--sea-deep)}

/* cards / panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--sea);color:#FFF6E3;font-weight:800;font-size:13.5px;border-radius:8px;padding:15px;margin:6px 0;
  text-transform:uppercase;letter-spacing:.09em;box-shadow:var(--shadow)}
.cta.quiet{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink)}
.cta:disabled{opacity:.5;cursor:default}

/* levels */
.lvlsec{margin-top:22px}
.lvlhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px}
.lvlt small{display:block;color:var(--muted);font-size:12.5px}
.lvln{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--lc)}
.lvlpap{font-size:19px;font-style:italic;font-weight:400;letter-spacing:0;text-transform:none;color:var(--lc)}
.lvlpct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.herechip{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:var(--lc);color:#fff;border-radius:9px;padding:3px 9px;white-space:nowrap}
.lvlbar{height:4px;margin:0 0 10px}
.lvlbar i{background:var(--lc)}
.lvlsec .deck{border-left:4px solid var(--lc)}

/* deck list */
.decks{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.deck{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;text-align:left;box-shadow:var(--shadow)}
.deck .em{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border-radius:8px;color:var(--lc,var(--sea-deep));
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  font-style:italic;font-weight:700;font-size:21px}
.deck .dt{flex:1;min-width:0}
.deck .dt b{display:block;font-size:15px}
.deck .dt small{color:var(--muted);font-size:12.5px}
.bar{display:block;height:5px;border-radius:3px;background:var(--panel2);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--sea)}
.bar i.full{background:var(--sun)}
.deck .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* session */
.sess-top{display:flex;align-items:center;gap:12px;padding:16px 0 10px}
.sess-top .bar{flex:1;margin:0;height:8px;border-radius:4px}
.xbtn{font-size:20px;color:var(--muted);width:34px;height:34px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 20px;
  box-shadow:var(--shadow);text-align:center;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.qcard .big{font-size:34px;line-height:1.15}
.qcard .mid{font-size:22px}
.qcard .lit{color:var(--muted);font-size:14px;font-style:italic}
.qcard .note{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.speak{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;
  background:var(--sea-soft);color:var(--sea-deep);font-size:15px;margin:0 auto}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 16px;text-align:left;
  font-size:16px;box-shadow:var(--shadow)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade{border-radius:12px;padding:12px 6px;font-weight:700;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.grade small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.grade.again{color:var(--bad)} .grade.good{color:var(--sea-deep)} .grade.easy{color:var(--good)}
.typebox{display:flex;gap:8px;margin-top:14px}
.typebox input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.typebox button{background:var(--sea);color:#fff;border-radius:12px;padding:0 18px;font-weight:700}
.accents{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.accents button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:15px}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:15px}
.feedback.ok{background:var(--good-soft);color:var(--ink)}
.feedback.no{background:var(--bad-soft);color:var(--ink)}
.contbtn{margin-top:10px}

/* done screen */
.done{ text-align:center;padding:40px 0}
.done .big{font-size:40px}
.done h2{margin:10px 0 4px}
.done p{color:var(--muted)}

/* grammar */
.gram h2{font-size:19px;margin:22px 0 8px}
.gram p{margin:8px 0;max-width:62ch}
.gram .panel{margin:10px 0}
.gram table{border-collapse:collapse;width:100%;font-size:15px}
.gram td,.gram th{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.gram th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gram .ex{color:var(--pap);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.tablewrap{overflow-x:auto}

/* dialogues & resources */
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:10px 0;box-shadow:var(--shadow)}
.dlg summary{padding:12px 16px;cursor:pointer;font-size:15px;list-style-position:inside}
.dlg summary small{color:var(--muted)}
.dlines{display:flex;flex-direction:column;gap:2px;padding:4px 10px 12px}
.dline{display:flex;gap:10px;text-align:left;padding:7px 8px;border-radius:8px;align-items:baseline;width:100%}
.dline:hover{background:var(--panel2)}
.dline .pap{display:block;font-size:16.5px}
.dline small{color:var(--muted)}
.who{flex:none;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.who.a{background:var(--sea-soft);color:var(--sea-deep)}
.who.b{background:var(--sun-soft);color:var(--sun-ink)}
.res{margin:0;padding-left:20px}
.res li{margin:8px 0}
.res a{color:var(--sea-deep);font-weight:600}

/* gespreksoefening (rollenspel) */
.chat{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.bub{max-width:86%;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow)}
.bub.me{align-self:flex-end;background:var(--sea-soft);border-color:var(--sea)}
.bub .pap{display:block;font-size:16.5px;text-align:left}
.bub small{color:var(--muted)}
.bub .who2{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.cue .mid{font-size:20px;margin:6px 0}
.dlgbtns{display:flex;gap:8px;margin:2px 10px 12px}
.dlgbtns .cta{margin:0;padding:11px;font-size:12px}

/* Papia ku Claude */
.scens{display:flex;flex-wrap:wrap;gap:8px}
.scens .cta{width:auto;flex:1 1 40%;margin:0;padding:11px;font-size:12px}
.bub .txt{white-space:pre-wrap}

/* browse list */
.browse{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.brow .pap{font-size:17px}
.brow small{color:var(--muted);text-align:right}
.lvldots{font-size:9px;color:var(--sea);letter-spacing:2px;vertical-align:2px;white-space:nowrap}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:5}
.tabs{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{padding:10px 4px 12px;text-align:center;color:var(--muted);font-size:11px;font-weight:600}
.tab svg{width:22px;height:22px;display:block;margin:0 auto 3px;stroke:currentColor;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--sea-deep)}
.badge{display:inline-block;min-width:17px;padding:1px 5px;border-radius:9px;background:var(--coral);color:#fff;
  font-size:10.5px;font-weight:700;margin-left:3px;font-variant-numeric:tabular-nums}
.backrow{padding:16px 0 4px}
.backrow button{color:var(--sea-deep);font-weight:600;font-size:14px}
.subtle{color:var(--muted);font-size:13.5px}
.center{text-align:center}
/* micro-interactions */
.deck,.opt,.cta,.grade,.iconbtn{transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,filter .12s ease}
.deck:hover,.opt:not(:disabled):hover{transform:translateY(-1px);border-color:var(--sea)}
.cta:hover:not(:disabled){filter:brightness(1.06)}
.cta:active,.deck:active,.opt:active,.grade:active{transform:scale(.985)}
.bar i{transition:width .35s ease}
@media (prefers-reduced-motion: no-preference){
  .qcard{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}

/* ===== retro-poster afwerking ===== */
h1,h2,.deck .dt b,.brand h1{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.deck .dt b{font-size:16px}
.panel,.deck,.qcard,.opt,.stat,.grade,.brow,.dlg,.iconbtn{border-radius:8px;border-width:1.5px}
.qcard{border-radius:10px;border-width:2px;border-color:var(--ink)}
.eyebrow{letter-spacing:.18em}
.bar,.bar i{border-radius:1px}
.badge,.herechip{border-radius:4px}
.typebox input,.typebox button{border-radius:8px}
.typebox button{text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:#FFF6E3}
.speak{border:1.5px solid var(--sea-deep)}
.grades .grade{text-transform:uppercase;letter-spacing:.05em;font-size:13px}
.grade small{text-transform:none;letter-spacing:0}
.cta:active{transform:translate(2px,2px);box-shadow:0 0 0 transparent}
.stat b{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.done .big{font-size:44px}
.icn{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.speak .icn{width:17px;height:17px;vertical-align:0}
.iconbtn .icn,.wod .icn{vertical-align:-2px;opacity:.9}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .lvln,:root:not([data-theme="light"]) .lvlpap{color:color-mix(in srgb,var(--lc) 55%,#F0E3C6)}
}
:root[data-theme="dark"] .lvln,:root[data-theme="dark"] .lvlpap{color:color-mix(in srgb,var(--lc) 55%,#F0E3C6)}
:root[data-theme="light"] .lvln,:root[data-theme="light"] .lvlpap{color:var(--lc)}
</style>

<div id="shell">
  <header>
    <div class="brand">
      <div class="facades" aria-hidden="true"></div>
      <h1>Siña <span class="pap">Papiamentu</span></h1>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="ttsbtn" title="Audio (benadering, Spaanse stem)" aria-pressed="true"><svg class="icn" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4Z" fill="currentColor" stroke="none"/><path d="M15 9.2a4 4 0 0 1 0 5.6"/><path d="M17.3 6.8a7.6 7.6 0 0 1 0 10.4"/></svg></button>
      <button class="iconbtn" id="themebtn" title="Licht/donker wisselen">◐</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav aria-label="Onderdelen"><div class="tabs" id="tabs"></div></nav>

function today(){return new Date().toISOString().slice(0,10);}
function bumpStreak(){const t=today();if(S.streak.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);

const IDS=Object.keys(ALL);
function st(id){return S.srs[id];}
const DAY=864e5;
/* SM-2 lite. grade: 0 again, 1 good, 2 easy */
function gradeCard(id,g){
  let c=S.srs[id]||{ivl:0,ease:2.5,due:0,reps:0,lapses:0};
  if(g===0){c.lapses++;c.reps=Math.max(0,c.reps-1);c.ivl=0;c.due=Date.now()+60e3;c.ease=Math.max(1.3,c.ease-0.2);}
  else{
    c.reps++;
    if(c.ivl===0)c.ivl=g===2?3:(c.reps>1?1:0.007);   /* first pass: ~10 min; easy jumps to 3 d */
    else if(c.ivl<1)c.ivl=(g===2?3:1);
    else c.ivl=Math.round(c.ivl*(g===2?c.ease*1.3:c.ease)*10)/10;
    if(g===2)c.ease=Math.min(3,c.ease+0.05);
    c.due=Date.now()+c.ivl*DAY;
  }
  S.srs[id]=c;S.xp+=g===0?1:2;save();
}

const $=s=>document.querySelector(s);
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];}
function answerOk(guess,target){const g=norm(guess),t=norm(target);if(!g)return false;
  if(g===t)return true;return t.length>4&&lev(g,t)<=1;}

  };
}

/* ---- deck ---- */
function deckView(id){

/* ---- sessions ---- */
let Q=null;
function startLearn(d){
  const fresh=d.cards.filter(c=>!st(d.id+":"+c[0])).slice(0,8).map(c=>d.id+":"+c[0]);
  if(!fresh.length)return;
  const steps=fresh.map(id=>({id,mode:"intro"}));
  shuffle(fresh).forEach(id=>steps.push({id,mode:"mc_pe"}));
  shuffle(fresh).forEach(id=>steps.push({id,mode:"mc_ep"}));
  Q={steps,i:0,title:"Leren · "+d.name,right:0,wrong:0,learn:true};step();
}
function startSession(ids,title,drill){
  if(!ids.length)return;
  const steps=shuffle(ids).slice(0,drill?ids.length:20).map(id=>{
    const l=lvl(id);
    const mode=l<=1?"mc_pe":l===2?"mc_ep":
      l===3?(Math.random()<0.5?"type_ep":"speak_ep"):
      ["flash","type_ep","speak_ep"][Math.floor(Math.random()*3)];
    return {id,mode};});
  Q={steps,i:0,title,right:0,wrong:0,drill:!!drill};step();
}
function sessTop(){const pct=Math.round(100*Q.i/Q.steps.length);
  return `<div class="sess-top"><button class="xbtn" id="quit" title="Sessie stoppen">✕</button>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <span class="subtle" style="font-variant-numeric:tabular-nums">${Q.i}/${Q.steps.length}</span></div>`;}
function step(){
  if(!Q||Q.i>=Q.steps.length)return finish();
  const s=Q.steps[Q.i],c=ALL[s.id];
  ({intro,mc_pe:()=>mc(s,c,true),mc_ep:()=>mc(s,c,false),type_ep:()=>typeEx(s,c),flash:()=>flash(s,c),speak_ep:()=>speakEx(s,c)})[s.mode]?.(s,c);
  $("#quit").onclick=()=>{Q=null;render();};
}
function speakBtn(t){return `<button class="speak" data-say="${esc(t)}" title="Luister (benadering met Spaanse stem)">${SVG_SPK}</button>`;}
function wireSpeak(){$("#view").querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));}

function intro(s,c){
  $("#view").innerHTML=sessTop()+`
  <div class="qcard">
    <p class="eyebrow">Nieuwe kaart</p>
    <div class="big pap">${esc(c.p)}</div>
    <div class="mid">${esc(c.e)}</div>
    ${c.n?`<div class="note">${esc(c.n)}</div>`:""}
    ${speakBtn(c.p)}
    <div class="lit">Zeg het hardop na — spreken vanaf dag één</div>
  </div>
  <button class="cta contbtn" id="next">Begrepen →</button>`;
  wireSpeak();speak(c.p);
  $("#next").onclick=()=>{Q.i++;step();};
}
function flash(s,c){
  $("#view").innerHTML=sessTop()+`
  <div class="qcard">
    <p class="eyebrow">${lvlTag(s.id)}Alleen Papiamentu — weet je 'm nog?</p>
    <div class="big pap">${esc(c.p)}</div>
    ${speakBtn(c.p)}
    <div id="ans" hidden><div class="mid">${esc(c.e)}</div>${c.n?`<div class="note">${esc(c.n)}</div>`:""}</div>
  </div>
  <div id="zone"><button class="cta contbtn" id="show">Toon antwoord</button></div>`;
  wireSpeak();
  $("#show").onclick=()=>{$("#ans").hidden=false;
    $("#zone").innerHTML=`<div class="grades">
      <button class="grade again">Opnieuw<small>&lt;1 min</small></button>
      <button class="grade good">Goed<small>${ivlPreview(s.id,1)}</small></button>
      <button class="grade easy">Makkelijk<small>${ivlPreview(s.id,2)}</small></button></div>`;
    [["again",0],["good",1],["easy",2]].forEach(([k,g])=>
      $(".grade."+k).onclick=()=>{answer(s,g===0?false:true,g);});};
}
function ivlPreview(id,g){const c=st(id);if(!c||c.ivl<1)return g===2?"3 d":"1 d";
  const n=Math.round(c.ivl*(g===2?c.ease*1.3:c.ease));return n+" d";}
function speakEx(s,c){
  $("#view").innerHTML=sessTop()+`
  <div class="qcard">
    <p class="eyebrow">${lvlTag(s.id)}Zeg het hardop in het Papiamentu</p>
    <div class="mid">${esc(c.e)}</div>
    <div id="heard" class="lit"></div>
    <div id="ans" hidden><div class="big pap">${esc(c.p)}</div>${c.n?`<div class="note">${esc(c.n)}</div>`:""}</div>
  </div>
  <div id="zone">
    ${SR?`<button class="cta" id="mic">Spreek nu — ik luister</button>`:""}
    <button class="cta ${SR?"quiet ":""}contbtn" id="show">Toon antwoord</button>
  </div>`;
  let rec=null;
  const reveal=()=>{if(rec){try{rec.abort();}catch(e){}rec=null;}
    $("#ans").hidden=false;speak(c.p);
    $("#zone").innerHTML=`<div class="grades">
      <button class="grade again">Opnieuw<small>&lt;1 min</small></button>
      <button class="grade good">Goed<small>${ivlPreview(s.id,1)}</small></button>
      <button class="grade easy">Makkelijk<small>${ivlPreview(s.id,2)}</small></button></div>
    <p class="subtle center" style="margin-top:8px">Zei je het (bijna) goed? Wees eerlijk — dat is het hele spel.</p>`;
    [["again",0],["good",1],["easy",2]].forEach(([k,g])=>
      $(".grade."+k).onclick=()=>{answer(s,g!==0,g);});};
  $("#show").onclick=()=>reveal();
  if(SR)$("#mic").onclick=()=>{
    try{
      rec=new SR();rec.lang=VOICE?VOICE.lang:"es-ES";rec.maxAlternatives=3;
      $("#heard").textContent="Ik luister…";
      rec.onresult=e=>{const alts=[...e.results[0]].map(a=>a.transcript);
        const hit=alts.find(t=>answerOk(t,c.p));
        $("#heard").textContent=`Ik hoorde: “${alts[0]}” ${hit?"— klinkt goed! ✓":"— vergelijk zelf ↓"}`;
        reveal();};
      rec.onerror=()=>{$("#heard").textContent="Microfoon niet beschikbaar hier — zeg het hardop en beoordeel jezelf.";};
      rec.start();
    }catch(e){$("#heard").textContent="Spraakherkenning niet beschikbaar — zeg het hardop en beoordeel jezelf.";}
  };
}
function mc(s,c,papToEng){
  const pool=shuffle(IDS.filter(x=>x!==s.id&&ALL[x].e!==c.e&&ALL[x].p!==c.p)).slice(0,3).map(x=>ALL[x]);
  const opts=shuffle([c,...pool]);
  const q=papToEng?c.p:c.e, side=x=>papToEng?x.e:x.p;
  $("#view").innerHTML=sessTop()+`
  <div class="qcard">
    <p class="eyebrow">${lvlTag(s.id)}${papToEng?"Wat betekent dit?":"Hoe zeg je dit?"}</p>
    <div class="big ${papToEng?"pap":""}">${esc(q)}</div>
    ${papToEng?speakBtn(c.p):""}
  </div>
  <div class="opts">${opts.map((o,i)=>`<button class="opt ${papToEng?"":"pap"}" data-i="${i}">${esc(side(o))}</button>`).join("")}</div>
  <div id="fb"></div>`;
  wireSpeak();if(papToEng)speak(c.p);
  $("#view").querySelectorAll(".opt").forEach((b,i)=>b.onclick=()=>{
    const ok=opts[i]===c;
    $("#view").querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;
      if(opts[j]===c)x.classList.add("right");else if(j===i&&!ok)x.classList.add("wrong");});
    if(!papToEng)speak(c.p);
    fbAndNext(s,ok,`<b class="pap">${esc(c.p)}</b> — ${esc(c.e)}${c.n?`<br><small>${esc(c.n)}</small>`:""}`);
  });
}
function typeEx(s,c){
  $("#view").innerHTML=sessTop()+`
  <div class="qcard">
    <p class="eyebrow">${lvlTag(s.id)}Typ het in het Papiamentu</p>
    <div class="mid">${esc(c.e)}</div>
  </div>
  <div class="typebox"><input id="tin" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Skirbi na papiamentu…"><button id="chk">Check</button></div>
  <div class="accents">${["è","ò","ù","á","é","í","ó","ú","ñ"].map(a=>`<button data-a="${a}">${a}</button>`).join("")}</div>
  <div id="fb"></div>`;
  const inp=$("#tin");inp.focus();
  $("#view").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{inp.value+=b.dataset.a;inp.focus();});
  const go=()=>{const ok=answerOk(inp.value,c.p);inp.disabled=true;$("#chk").disabled=true;speak(c.p);
    const exact=norm(inp.value)===norm(c.p);
    fbAndNext(s,ok,`<b class="pap">${esc(c.p)}</b> — ${esc(c.e)}${ok&&!exact?`<br><small>Bijna goed — let op de spelling: <b>${esc(c.p)}</b></small>`:""}`);};
  $("#chk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter"&&!inp.disabled)go();};
}
function fbAndNext(s,ok,detail){
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"no"}"><b>${ok?"Bon trabou!":"Net niet."}</b><br>${detail}</div>
  <button class="cta contbtn" id="next">Verder →</button>`;
  const n=$("#next");n.focus();
  n.onclick=()=>answer(s,ok);
}
function answer(s,ok,flashGrade){
  if(ok){Q.right++;}else{Q.wrong++;}
  if(Q.learn){
    if(s.mode==="mc_ep")gradeCard(s.id,ok?1:0);
    else if(!ok)Q.steps.push({id:s.id,mode:"mc_pe"});
  } else if(flashGrade!==undefined){gradeCard(s.id,flashGrade);if(flashGrade===0)requeue(s);}
  else{gradeCard(s.id,ok?1:0);if(!ok)requeue(s);}
  Q.i++;step();
}
function requeue(s){const pos=Math.min(Q.steps.length,Q.i+3);
  Q.steps.splice(pos,0,{id:s.id,mode:"mc_pe"});}
function finish(){
  if(!Q)return render();
  const {right,wrong,title}=Q;Q=null;
  if(right+wrong>0)bumpStreak();
  const acc=right+wrong?Math.round(100*right/(right+wrong)):100;
  $("#view").innerHTML=`<div class="done">
    <div class="big pap" style="font-style:italic">${acc>=90?"Masha bon!":acc>=70?"Bon trabou!":"Sigui purba!"}</div>
    <p style="margin-top:10px">${right} goed · ${wrong} gemist · ${acc}% — ${esc(title)}</p>
    <p class="subtle">${streakLive()} dag${streakLive()===1?"":"en"} op rij</p>
    <button class="cta" id="home2">Verder</button></div>`;
  $("#home2").onclick=render;
}

/* ---- gespreksoefening: speel één rol in een dialoog ---- */
let CONV=null;
function convStart(di,role){CONV={di,role,i:0};convStep();}
function convStep(){
  const C=CONV;if(!C)return;
  const d=DIALOGS[C.di],lines=d.lines;
  const done=C.i>=lines.length;
  const cur=done?null:lines[C.i];
  const mine=cur&&cur[0]===C.role;
  const bubbles=lines.slice(0,C.i+((cur&&!mine)?1:0)).map(l=>{
    const me=l[0]===C.role;
    return `<div class="bub${me?" me":""}"><span class="who2">${me?"Jij":"Gesprekspartner"}</span>
      <button class="pap" data-say="${esc(l[1])}">${esc(l[1])}</button><small>${esc(l[2])}</small></div>`;}).join("");
  $("#view").innerHTML=`
  <div class="sess-top"><button class="xbtn" id="quit" title="Stoppen">✕</button>
    <div style="flex:1"><span class="eyebrow">Gesprek · jij bent persoon ${C.role}</span><br><b class="pap" style="font-size:17px">${esc(d.t)}</b></div>
    <span class="subtle" style="font-variant-numeric:tabular-nums">${Math.min(C.i,lines.length)}/${lines.length}</span></div>
  <div class="chat">${bubbles}</div>
  ${done?`<div class="panel center"><p style="margin:0 0 10px"><b class="pap" style="font-size:20px;font-style:italic">Masha bon!</b><br><span class="subtle">Gesprek voltooid.</span></p>
    <button class="cta" id="again">Nog een keer — nu als persoon ${C.role==="A"?"B":"A"}</button>
    <button class="cta quiet" id="back2">Terug naar de dialogen</button></div>`
  :mine?`<div class="panel cue"><p class="eyebrow">Jouw beurt — zeg dit in het Papiamentu</p>
    <div class="mid">${esc(cur[2])}</div>
    <div id="ans2" hidden><div class="pap" style="font-size:22px;margin:4px 0 10px">${esc(cur[1])}</div></div>
    <div id="zone2">
      ${SR?`<button class="cta" id="mic2">Spreek nu — ik luister</button>`:""}
      <button class="cta ${SR?"quiet ":""}" id="show2">Toon antwoord</button>
    </div><div id="heard2" class="subtle"></div></div>`
  :`<button class="cta" id="next2">Verder</button>`}`;
  wireSpeak();
  $("#quit").onclick=()=>{CONV=null;render();};
  window.scrollTo(0,document.body.scrollHeight);
  if(done){bumpStreak();
    $("#again").onclick=()=>convStart(C.di,C.role==="A"?"B":"A");
    $("#back2").onclick=()=>{CONV=null;render();};return;}
  if(!mine){speak(cur[1]);$("#next2").onclick=()=>{C.i++;convStep();};}
  else{
    const reveal=()=>{$("#ans2").hidden=false;speak(cur[1]);
      $("#zone2").innerHTML=`<button class="cta" id="next2">Verder</button>`;
      $("#next2").onclick=()=>{C.i++;convStep();};};
    $("#show2").onclick=reveal;
    if(SR)$("#mic2").onclick=()=>{try{
      const r=new SR();r.lang=VOICE?VOICE.lang:"es-ES";r.maxAlternatives=3;
      $("#heard2").textContent="Ik luister…";
      r.onresult=e=>{const t=e.results[0][0].transcript;$("#heard2").textContent=`Ik hoorde: “${t}”`;reveal();};
      r.onerror=()=>{$("#heard2").textContent="Microfoon niet beschikbaar — zeg het hardop en check jezelf.";};
      r.start();}catch(e){$("#heard2").textContent="Spraakherkenning niet beschikbaar — zeg het hardop en check jezelf.";}};
  }
}

/* ---- Papia ku Claude: vrij gesprek via de Claude API ---- */
const SCEN=[
["Na merkado","een marktverkoper op de drijvende markt van Willemstad"],
["Den taxi","een taxichauffeur op Curaçao"],
["Topa un hende","iemand die de leerling op het strand ontmoet"],
["Na fiesta","een gast op een verjaardagsfeest op Curaçao"],
["Kombersashon liber","een vriendelijke local die over het dagelijks leven kletst"]];
function aiPrompt(i){return "Ik leer Papiamentu (Curaçaose spelling, beginnersniveau). Laten we een rollenspel doen: jij bent "+SCEN[i][1]+". Spreek Papiamentu in korte, eenvoudige zinnen en zet achter elke zin de Nederlandse vertaling tussen haakjes. Ik antwoord in het Papiamentu. Verbeter mijn fouten kort en vriendelijk in het Nederlands en stel steeds één vraag terug. Begin het gesprek.";}
let CHAT=null;
function aiSys(){return "Je bent "+CHAT.role+" en een geduldige Papiamentu-gesprekspartner voor een Nederlandstalige beginner. Blijf in je rol. Spreek Papiamentu (Curaçaose/Bonaireaanse spelling) in korte, eenvoudige zinnen — maximaal 3 per beurt — en zet direct achter elke Papiamentu-zin de Nederlandse vertaling tussen haakjes. De leerling antwoordt in het Papiamentu. Maakt de leerling een fout, verbeter die dan eerst kort en vriendelijk in het Nederlands en ga daarna in je rol verder. Eindig elke beurt met één vraag zodat het gesprek doorloopt.";}
function aiStart(i){CHAT={t:SCEN[i][0],role:SCEN[i][1],hist:[],busy:false,err:"",draft:""};aiSend(null);}
async function aiSend(text){
  const C=CHAT;if(!C||C.busy)return;
  C.err="";
  if(text)C.hist.push({role:"user",content:text});
  else if(!C.hist.length)C.hist.push({role:"user",content:"Start het gesprek nu met een korte begroeting in je rol."});
  if(C.hist.length>25)C.hist=[C.hist[0],...C.hist.slice(-20)];
  C.busy=true;aiRender();
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "content-type":"application/json",
      "x-api-key":S.apikey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-opus-4-8",max_tokens:1024,system:aiSys(),messages:C.hist})});
    const d=await r.json().catch(()=>null);
    if(!r.ok){
      const msg=r.status===401?"Ongeldige API-sleutel — controleer hem op console.anthropic.com.":
        r.status===429?"Even te veel verzoeken — wacht een paar seconden en probeer opnieuw.":
        (d&&d.error&&d.error.message)||("Fout "+r.status);
      throw new Error(msg);
    }
    if(d.stop_reason==="refusal")throw new Error("Claude heeft dit verzoek geweigerd. Probeer het anders te formuleren.");
    const txt=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    if(!txt)throw new Error("Leeg antwoord ontvangen — probeer opnieuw.");
    C.hist.push({role:"assistant",content:txt});
  }catch(e){
    C.err=(e instanceof TypeError)?
      "Kan de Claude API niet bereiken. In de artifact-weergave blokkeert de beveiliging dit — gebruik de GitHub Pages-versie of het lokale bestand, of open het gesprek via claude.ai.":
      (e.message||"Onbekende fout");
    const last=C.hist[C.hist.length-1];
    if(last&&last.role==="user"&&C.hist.length>1){C.hist.pop();C.draft=last.content;}
  }
  C.busy=false;aiRender();
}
function aiRender(){
  const C=CHAT;if(!C)return;
  const msgs=C.hist.slice(1);
  $("#view").innerHTML=`
  <div class="sess-top"><button class="xbtn" id="quit" title="Stoppen">✕</button>
    <div style="flex:1"><span class="eyebrow">Papia ku Claude · rollenspel</span><br><b class="pap" style="font-size:17px">${esc(C.t)}</b></div></div>
  <div class="chat">${msgs.map(m=>`<div class="bub${m.role==="user"?" me":""}">
    <span class="who2">${m.role==="user"?"Jij":"Claude"}</span><div class="txt">${esc(m.content)}</div></div>`).join("")}
  ${C.busy?`<div class="bub"><span class="who2">Claude</span><i class="subtle">ta pensa…</i></div>`:""}</div>
  ${C.err?`<div class="feedback no"><b>Fout.</b> ${esc(C.err)}</div>`:""}
  <div class="typebox"><input id="ain" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Skirbi na papiamentu…" ${C.busy?"disabled":""}><button id="asend" ${C.busy?"disabled":""}>Stuur</button></div>
  <p class="subtle" style="margin-top:6px">Antwoorden komen van Claude Opus 4.8 via jouw eigen API-sleutel (± 1 cent per antwoord).</p>`;
  $("#quit").onclick=()=>{CHAT=null;render();};
  const inp=$("#ain");
  if(inp&&!C.busy){inp.value=C.draft||"";C.draft="";
    const go=()=>{const v=inp.value.trim();if(v)aiSend(v);};
    $("#asend").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go();};inp.focus();}
  window.scrollTo(0,document.body.scrollHeight);
}

/* ---- review / quiz / grammar tabs ---- */
function reviewHome(){
  const due=dueIds();
  $("#view").innerHTML=`<div style="padding-top:16px">
  <p class="eyebrow">Spaced repetition</p>
  <h2 style="margin:4px 0 10px">Repasá — herhalen</h2>
  <div class="panel">${due.length?
    `<p style="margin:0 0 10px"><b>${due.length}</b> kaart${due.length>1?"en staan":" staat"} klaar. Herhalingen komen precies vóórdat je zou vergeten — hier gebeurt het snelle leren.</p>
     <p class="subtle" style="margin:0 0 10px">Oefenvorm groeit mee met je niveau: herkennen → kiezen → typen &amp; hardop zeggen → alleen Papiamentu.</p>
     <button class="cta" id="go">Start herhaling</button>`:
    `<p style="margin:0">Niets te herhalen — dushi!<br><span class="subtle">Leer nieuwe kaarten op Home, of oefen een deck. Kom terug zodra het bolletje oplicht.</span></p>`}
  </div>
  ${startedCount()?`<button class="cta quiet" id="all" style="margin-top:10px">Oefen 20 willekeurige geleerde kaarten</button>`:""}
  </div>`;
  if(due.length)$("#go").onclick=()=>startSession(due,"Herhaling");
  const a=$("#all");if(a)a.onclick=()=>startSession(shuffle(IDS.filter(id=>st(id))).slice(0,20),"Oefening");
}
function quizHome(){
  const learned=IDS.filter(id=>st(id));
  $("#view").innerHTML=`<div style="padding-top:16px">
  <p class="eyebrow">Snelle quiz</p>
  <h2 style="margin:4px 0 10px">Tèst bo mes — test jezelf</h2>
  <div class="panel">
    <p style="margin:0 0 10px">10 vlotte vragen, gemengde vormen. ${learned.length>=8?"Uit de "+learned.length+" kaarten die je al gestart bent.":"Begint met de Overlevingskit tot je meer geleerd hebt."}</p>
    <button class="cta" id="go">Start quiz</button>
  </div></div>`;
  $("#go").onclick=()=>{
    let pool=learned.length>=8?learned:DECKS[0].cards.map(c=>"survival:"+c[0]);
    const steps=shuffle(pool).slice(0,10).map(id=>({id,mode:Math.random()<0.5?"mc_pe":"mc_ep"}));
    Q={steps,i:0,title:"Quiz",right:0,wrong:0,drill:true};step();};
}
function grammar(){
  $("#view").innerHTML=`<div class="gram" style="padding-top:16px">
  <p class="eyebrow">Spreken &amp; luisteren</p>
  <h2 style="margin-top:4px">Kombersashon — dialogen</h2>
  <p class="subtle">Echte gesprekken, zin voor zin. Tik op een regel om hem te horen — of <b>speel zelf een rol</b>: de app zegt de regels van je gesprekspartner, jij moet jouw regels in het Papiamentu zeggen.</p>
  ${DIALOGS.map((d,i)=>`<details class="dlg"${i===0?" open":""}><summary><b class="pap">${esc(d.t)}</b> <small>· ${esc(d.tr)}</small></summary>
    <div class="dlines">${d.lines.map(l=>`<button class="dline" data-say="${esc(l[1])}">
      <span class="who ${l[0]==="A"?"a":"b"}">${l[0]}</span>
      <span><span class="pap">${esc(l[1])}</span><small>${esc(l[2])}</small></span></button>`).join("")}
    </div>
    <div class="dlgbtns"><button class="cta convbtn" data-di="${i}" data-role="B">Speel — jij bent B</button>
    <button class="cta quiet convbtn" data-di="${i}" data-role="A">Jij bent A</button></div></details>`).join("")}
  <button class="cta quiet" id="prlines">Oefen deze zinnen als flashcards</button>

  <p class="eyebrow" style="margin-top:28px">Vrij gesprek</p>
  <h2 style="margin-top:4px">Papia ku Claude — oefen een écht gesprek</h2>
  <p class="subtle">Kies een scenario. Claude speelt de rol, spreekt Papiamentu op jouw niveau, vertaalt elke zin en verbetert je fouten in het Nederlands.</p>
  <div class="panel">
    <div class="scens">${SCEN.map((s,i)=>{
      const label=`<span class="pap" style="font-size:14px;text-transform:none;letter-spacing:0">${esc(s[0])}</span>`;
      return S.apikey?`<button class="cta scenbtn" data-i="${i}">${label}</button>`:
      `<a class="cta quiet scenbtn" style="text-decoration:none" href="https://claude.ai/new?q=${encodeURIComponent(aiPrompt(i))}" target="_blank" rel="noopener">${label}</a>`;}).join("")}</div>
    ${S.apikey?
    `<p class="subtle" style="margin:10px 0 0">Het gesprek opent hier in de app. <button id="delkey" style="text-decoration:underline;color:var(--bad)">API-sleutel wissen</button></p>`:
    `<p class="subtle" style="margin:10px 0 0">De knoppen openen een voorbereid gesprek op claude.ai — gratis account is genoeg.</p>
    <details style="margin-top:8px"><summary class="subtle" style="cursor:pointer">Liever hier in de app chatten? Plak een eigen API-sleutel</summary>
      <p class="subtle" style="margin:8px 0">Maak een sleutel op <a href="https://console.anthropic.com/" target="_blank" rel="noopener" style="color:var(--sea-deep)">console.anthropic.com</a> (API keys). De sleutel wordt alleen op dit apparaat bewaard en een antwoord kost ± 1 cent. Werkt in de GitHub Pages-versie en lokaal — niet in de artifact-weergave.</p>
      <div class="typebox" style="margin-top:0"><input id="keyin" type="password" autocomplete="off" placeholder="sk-ant-…"><button id="keysave">Bewaar</button></div>
    </details>`}
  </div>

  <p class="eyebrow" style="margin-top:28px">Spoedcursus</p>
  <h2 style="margin-top:4px">Gramátika — één keer lezen, altijd spreken</h2>
  ${GRAMMAR.map((g,i)=>`<h2>${i+1}. ${g.t}</h2>${g.h}`).join("")}

  <p class="eyebrow" style="margin-top:28px">Verdieping</p>
  <h2 style="margin-top:4px">Mas rekurso — voor échte stemmen</h2>
  <p class="subtle">Deze app bouwt je woordenschat en grammatica op; je oor heeft echte stemmen nodig. Dit zijn de beste Papiamentu-bronnen die er zijn:</p>
  <div class="panel"><ul class="res">
  ${RESOURCES.map(r=>`<li>${r[1]?`<a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])}</a>`:`<b>${esc(r[0])}</b>`} — ${esc(r[2])}</li>`).join("")}
  </ul></div>
  <p class="subtle" style="margin:20px 0">En — het allerbeste — elke dushi local die met je wil kletsen. Papia, papia, papia!</p>
  </div>`;
  wireSpeak();
  $("#prlines").onclick=()=>{TAB="home";renderTabs();deckView("dialog");};
  $("#view").querySelectorAll(".convbtn").forEach(b=>b.onclick=()=>convStart(+b.dataset.di,b.dataset.role));
  if(S.apikey)$("#view").querySelectorAll("button.scenbtn").forEach(b=>b.onclick=()=>aiStart(+b.dataset.i));
  const ks=$("#keysave");if(ks)ks.onclick=()=>{const v=$("#keyin").value.trim();
    if(v){S.apikey=v;save();grammar();window.scrollTo(0,0);}};
  const dk=$("#delkey");if(dk)dk.onclick=()=>{delete S.apikey;save();grammar();};
}

/* ================= BOOT ================= */
$("#ttsbtn").setAttribute("aria-pressed",String(S.tts));
$("#ttsbtn").onclick=()=>{S.tts=!S.tts;save();$("#ttsbtn").setAttribute("aria-pressed",String(S.tts));};
$("#themebtn").onclick=()=>{
  const cur=document.documentElement.dataset.theme||
    (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark";
  document.documentElement.dataset.theme=next;S.theme=next;save();};
if(S.theme)document.documentElement.dataset.theme=S.theme;
facades();render();
</script>
